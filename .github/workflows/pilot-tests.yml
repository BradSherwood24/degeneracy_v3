name: pilot-tests

# Linux CI for the degeneracy_v3 pilot suite (Phase H: prove the suite green on
# ubuntu before any Render deploy). The corpus-dependent tests (historical-data/ and
# sim/out/, both gitignored) are ABSENT in a fresh checkout, so they SKIP rather than
# error -- the skip count is printed by `-rs`. No test touches the network or the live
# signing proxy (proxy access is faked via injected transports); the proxy's own tests
# live in the separate degeneracy-proxy/ directory and are not part of this repo/CI.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (from .python-version)
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Byte-compile the pilot package
        run: python -m compileall pilot

      - name: Run the pilot test suite (corpus-dependent tests skip)
        working-directory: pilot
        run: python -m pytest -q -rs
